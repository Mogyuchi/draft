name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions: {}

jobs:
  format:
    name: format
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true

      - run: pnpm run --aggregate-output --reporter-hide-prefix "/.*:check$/"
        env:
          FORCE_COLOR: 3
